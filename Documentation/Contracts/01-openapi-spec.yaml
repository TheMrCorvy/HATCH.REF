openapi: 3.1.0
info:
  title: Unix Tamagotchi API
  version: 1.2.0
  description: REST API contract for cloud sync, dynamic plugin bundle manifests, shared Kaiju group care, first-time touch pairing, and IAP verification.
servers:
  - url: https://api.tamagotchi.internal/v1
    description: Production Edge Gateway
paths:
  /plugins/manifest:
    get:
      summary: Retrieve the active capability manifest for plugin bundles, scenarios, actions, and customizations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginManifest'

  /profile:
    get:
      summary: Get user profile, credits, and active group info
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /kaijus:
    get:
      summary: List all kaijus owned by the user's groups (SOLO, COUPLE, FRIENDS)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kaiju'

  /kaijus/{kaijuId}/action:
    post:
      summary: Commit an interaction action plugin
      parameters:
        - name: kaijuId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId:
                  type: string
                  example: city_destruction
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kaiju'

  /kaijus/{kaijuId}/name:
    patch:
      summary: Rename a Kaiju owned by the user's group (Phase 2+)
      parameters:
        - name: kaijuId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 16
                  example: KRONOS-7
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kaiju'

  /pair-bond/initiate:
    post:
      summary: Generate a 60s single-use pairing token for first-time COUPLE or FRIENDS physical touch pairing (or single-use no-NFC code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupType]
              properties:
                groupType:
                  type: string
                  enum: [COUPLE, FRIENDS]
                groupId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: PB-A3F9-X2K1
                  expiresAt:
                    type: string
                    format: date-time

  /pair-bond/accept:
    post:
      summary: Redeem a single-use pairing token (1 use only, invites 1 user into the COUPLE or FRIENDS group)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  example: PB-A3F9-X2K1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    format: uuid
                  groupType:
                    type: string
                    enum: [COUPLE, FRIENDS]
                  activeKaijuId:
                    type: string
                    format: uuid
                    nullable: true

  /store/purchase:
    post:
      summary: Spend credits to adopt a new digital Kaiju into the target group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kaijuType]
              properties:
                kaijuType:
                  type: string
                  enum: [godzilla, cyber_godzilla]
                groupId:
                  type: string
                  format: uuid
                name:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kaiju'

  /iap/verify:
    post:
      summary: Verify native Google Play or Apple StoreKit purchase receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, sku, purchaseToken]
              properties:
                platform:
                  type: string
                  enum: [android, ios]
                sku:
                  type: string
                purchaseToken:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  creditsAdded:
                    type: integer
                  newBalance:
                    type: integer

components:
  schemas:
    PluginManifest:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginBundleConfig'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionPluginConfig'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioPluginConfig'
        customizations:
          type: array
          items:
            $ref: '#/components/schemas/CustomizationPluginConfig'

    PluginBundleConfig:
      type: object
      properties:
        id:
          type: string
          example: core_habitat_bundle
        displayName:
          type: string
          example: Core Habitat Bundle
        version:
          type: string
          example: 1.0.0
        isEnabled:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true

    ActionPluginConfig:
      type: object
      properties:
        id:
          type: string
          example: city_destruction
        pluginId:
          type: string
          example: core_habitat_bundle
        displayName:
          type: string
          example: City Rampage
        actionType:
          type: string
          enum: [USER_TRIGGERED, AUTONOMOUS]
        isEnabled:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        targetScenarioId:
          type: string
          example: metropolis_ruins
        requiredFurniture:
          type: array
          items:
            type: string
          example: []
        parameters:
          type: object

    ScenarioPluginConfig:
      type: object
      properties:
        id:
          type: string
          example: metropolis_ruins
        pluginId:
          type: string
          example: core_habitat_bundle
        displayName:
          type: string
          example: Metropolis Ruins Destruction Zone
        isEnabled:
          type: boolean
        parameters:
          type: object

    CustomizationPluginConfig:
      type: object
      properties:
        id:
          type: string
          example: itm_desk
        pluginId:
          type: string
          example: phase3_study_bundle
        category:
          type: string
          enum: [FURNITURE, CLOTHING, SKIN, PALETTE, BOOT_MESSAGE]
        displayName:
          type: string
          example: WORK_STN (Desktop & Chair)
        priceCredits:
          type: integer
          example: 250
        isEnabled:
          type: boolean
        parameters:
          type: object

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        credits:
          type: integer
          example: 240
        maxKaijusAllowed:
          type: integer
          nullable: true
          example: null

    Kaiju:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        kaijuType:
          type: string
          enum: [godzilla, cyber_godzilla]
        name:
          type: string
          example: KRONOS-7
        ageInDays:
          type: integer
          example: 14
        activeScenarioId:
          type: string
          example: default_room
        hunger:
          type: integer
        energy:
          type: integer
        happiness:
          type: integer
        extendedStats:
          type: object
          additionalProperties:
            type: integer
          example:
            intel: 20
            comfort: 50
            hydration: 80
            hp: 100
        statusFlags:
          type: object
          additionalProperties:
            type: boolean
          example:
            is_exhausted: false
